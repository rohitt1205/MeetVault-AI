<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetVault OAuth Complete</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: rgba(15, 23, 42, 0.12);
        --accent: #2563eb;
        --error: #dc2626;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(37, 99, 235, 0.08), transparent 35%),
          var(--bg);
        color: var(--text);
        font-family: Inter, Segoe UI, Arial, sans-serif;
      }

      .card {
        width: min(92vw, 420px);
        padding: 28px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--card);
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.08);
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
        font-size: 14px;
      }

      .status {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(37, 99, 235, 0.06);
        border: 1px solid rgba(37, 99, 235, 0.14);
        color: var(--text);
        font-size: 14px;
      }

      .status.error {
        background: rgba(220, 38, 38, 0.06);
        border-color: rgba(220, 38, 38, 0.14);
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <p class="eyebrow">MeetVault AI</p>
      <h1>Authorization complete</h1>
      <p id="message">Finishing the connection and returning you to MeetVault.</p>
      <div id="status" class="status">Updating your workspace connection...</div>
    </main>

    <script>
      (() => {
        const storageKey = 'meetvault-mcp-oauth-event'
        const channelName = 'meetvault-mcp-oauth'
        const params = new URLSearchParams(window.location.search)
        const oauthProviders = ['github', 'slack', 'salesforce', 'notion', 'gmail']
        const provider = oauthProviders.find((name) => params.has(`${name}_connected`))
        const connected = provider ? params.get(`${provider}_connected`) === 'true' : false
        const error = params.get('mcp_error') || ''
        const messageEl = document.getElementById('message')
        const statusEl = document.getElementById('status')

        if (provider) {
          const payload = {
            provider,
            connected,
            error,
            ts: Date.now(),
          }
          try {
            localStorage.setItem(storageKey, JSON.stringify(payload))
          } catch (storageError) {
            console.error('Could not broadcast MCP OAuth completion.', storageError)
          }
          try {
            const channel = new BroadcastChannel(channelName)
            channel.postMessage(payload)
            channel.close()
          } catch {
            // BroadcastChannel is a best-effort enhancement.
          }
          try {
            if (window.opener) {
              window.opener.postMessage(payload, '*')
            }
          } catch {
            // Some browsers block opener messaging; other channels still carry the event.
          }
        }

        if (connected) {
          statusEl.textContent = 'Connection saved. You can close this tab now.'
        } else if (provider) {
          statusEl.textContent = error || `${provider} connection failed.`
          statusEl.classList.add('error')
          messageEl.textContent = 'We could not complete the authorization request.'
        } else {
          statusEl.textContent = 'No OAuth result was detected.'
        }

      })()
    </script>
  </body>
</html>
